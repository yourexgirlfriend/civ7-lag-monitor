name: Build macOS App

on:
  workflow_dispatch:  # только ручной запуск — когда готова новая версия

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write  # нужно для создания Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version
        id: version
        run: echo "version=$(cat version.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          pip install pyinstaller customtkinter psutil pyperclip pillow

      - name: Build .app
        run: |
          python -m PyInstaller \
            --windowed \
            --icon=icon.icns \
            --add-data "icon.icns:." \
            --name "Civ7 Lag Monitor" \
            civ7_monitor_mac.py

      - name: Zip the .app
        run: |
          cd dist
          zip -r "Civ7_Lag_Monitor_mac_v${{ steps.version.outputs.version }}.zip" "Civ7 Lag Monitor.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-mac
          name: Civ7 Lag Monitor v${{ steps.version.outputs.version }} (macOS)
          body: macOS build of Civ7 Lag Monitor v${{ steps.version.outputs.version }}
          files: dist/Civ7_Lag_Monitor_mac_v${{ steps.version.outputs.version }}.zip
